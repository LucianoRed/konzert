quarkus.http.port=8080

# One image, two agents: AGENT_NAME (and the seeded ConfigMap) make it Atlas or
# Sentinel. The soul, the playbook catalogue and the intake rules are configuration.
agent.name=${AGENT_NAME:worker}
kafka.bootstrap=konzert-kafka-kafka-bootstrap.kafka.svc:9092
# Fixed per agent (set by the chart): a restart must not replay the conversation.
kafka.group-id=${KAFKA_GROUP_ID:konzert-worker}

konzert.conversation-topic=konzert.conversation
konzert.actions-topic=konzert.actions
konzert.namespace=${KONZERT_NAMESPACE:konzert-demo}
# An incident nobody closed is released after this long, so it cannot block the next one.
konzert.idle-close-minutes=10

# The agent's only hands.
mcp.ansible.url=${MCP_ANSIBLE_URL:http://konzert-mcp-ansible:8080/mcp/sse}
# A playbook run waits for rollouts; give the tool call room.
mcp.call-timeout-seconds=300
# The business workload(s) the team protects; Atlas checks them by name after a quarantine.
konzert.workloads=${KONZERT_WORKLOADS:checkout-api}
# The other agents on the team, by name. Maestro has the same property.
konzert.team=${KONZERT_TEAM:atlas,sentinel}
# Language of anything addressed to the human operator (a plan, a report). Agent-to-agent stays English.
konzert.human-language=${KONZERT_HUMAN_LANGUAGE:English}
