quarkus.http.port=8080

# Who this agent is. The chart sets AGENT_NAME; the name selects the
# <name>-config and <name>-secrets objects the configuration is read from.
agent.name=${AGENT_NAME:scribe}

kafka.bootstrap=konzert-kafka-kafka-bootstrap.kafka.svc:9092
# One fixed group per agent role: replicas share it, and a restart does not
# replay the conversation.
kafka.group-id=${KAFKA_GROUP_ID:konzert-scribe}

konzert.conversation-topic=konzert.conversation
