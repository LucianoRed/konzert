<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Atlas, the infrastructure agent">
  <title>Atlas</title>
  <!-- Infrastructure: something heavy, held up, with a boundary drawn around it. -->
  <defs>
    <linearGradient id="atlasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#atlasBg)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>

  <!-- the load being carried -->
  <g fill="#e0f2fe">
    <rect x="38" y="26" width="44" height="14" rx="3"/>
    <rect x="44" y="44" width="32" height="12" rx="3" opacity="0.85"/>
  </g>

  <!-- the limit: a bracket that bounds what is above it -->
  <g fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 64 L30 74 L90 74 L90 64"/>
  </g>

  <!-- shoulders holding it up -->
  <g fill="#e0f2fe">
    <path d="M42 82 q18 -6 36 0 l6 18 q-24 8 -48 0 z"/>
  </g>
  <circle cx="60" cy="84" r="6" fill="#075985"/>
</svg>
