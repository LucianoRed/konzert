# Checks every pull request and every push to main: the build and its tests,
# the charts, a scan for secrets, and a review of new dependencies.
#
# A pull request can come from anyone, so this workflow is written for code it
# does not trust:
#   - it runs on `pull_request`, never `pull_request_target`, so a pull request
#     from a fork gets a read-only token and no secrets;
#   - it asks for read access to the contents and nothing else;
#   - it uses only actions owned by GitHub, pinned to a commit;
#   - nothing a pull request controls (a title, a branch name, a file name) is
#     interpolated into a script.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a cache written by one run and read by another is
      # a way for a pull request to reach a later build.
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        run: mvn -B -ntp verify

  charts:
    name: Lint the charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: |
          set -euo pipefail
          helm version --short
          helm lint \
            deploy/helm/agent \
            examples/incident-response/deploy/helm/sensor \
            examples/incident-response/deploy/helm/mcp-ansible \
            examples/incident-response/deploy/helm/console

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TRUFFLEHOG_VERSION: 3.90.8
      # sha256 of trufflehog_<version>_linux_amd64.tar.gz, from the release's checksums file
      TRUFFLEHOG_SHA256: aa2258dc4e76d93518730331e69ca01a638c365ab862a828c566e025f6c8150c
    steps:
      - name: Check out, with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the scanner
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl -fsSL --output "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" trufflehog

      # --no-verification: a candidate is never sent anywhere to be tried.
      # The findings file holds the secret itself, so it stays in the runner's
      # temporary directory, is never uploaded, and only the detector, the
      # file, the line and the commit are printed. This log is public.
      #
      # What is scanned is the whole history of the commit under test: for a
      # pull request, main plus what the pull request adds. Branches that are
      # not part of it are left to their own runs.
      #
      # The scanner can also be limited to the commits after a given one. That
      # was tried and rejected: it goes by commit date, so any commit older
      # than the tip of main is skipped, which is true of most pull requests,
      # and the result still looks clean.
      #
      # The scanner version above is not updated by Dependabot. After changing
      # it, open a pull request that adds a fake key and check this job fails.
      - name: Scan
        run: |
          set -uo pipefail
          findings="$RUNNER_TEMP/findings.jsonl"
          log="$RUNNER_TEMP/trufflehog.log"
          args=(--json --no-update --no-verification --fail --branch HEAD)

          rc=0
          "$RUNNER_TEMP/bin/trufflehog" git "file://$GITHUB_WORKSPACE" "${args[@]}" \
            > "$findings" 2> "$log" || rc=$?

          # A file name is text a pull request chose, and so is anything the
          # scanner echoes back. Stop the runner from reading what follows as
          # a command, and strip what could fake one.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          jq -r '
            select(.SourceMetadata.Data.Git != null)
            | .SourceMetadata.Data.Git as $g
            | "\(.DetectorName) \($g.file):\($g.line) commit \($g.commit[0:12])"
            | gsub("[[:cntrl:]]"; " ") | gsub("::"; ": :")
          ' "$findings" || true
          if [[ "$rc" -ne 0 && "$rc" -ne 183 ]]; then
            tail -n 20 "$log" | tr -d '\000-\010\013-\037' || true
          fi
          echo "::$token::"
          rm -f "$findings"

          if [[ "$rc" -eq 183 ]]; then
            echo "::error::possible secrets found. If one is real, revoke it first: removing the commit does not un-leak it."
            exit 1
          elif [[ "$rc" -ne 0 ]]; then
            echo "::error::the scanner failed with exit code $rc"
            exit 1
          fi

          # A scan that read nothing must not pass as a clean scan.
          chunks="$(grep -o '"chunks":[0-9]*' "$log" | tail -n 1 | cut -d: -f2 || true)"
          if [[ ! "$chunks" =~ ^[0-9]+$ || "$chunks" -eq 0 ]]; then
            echo "::error::the scanner read nothing, so this is not a clean result"
            exit 1
          fi
          echo "No secrets found in $chunks chunks."

  dependencies:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails when the pull request adds a dependency, declared in a pom, with
      # a known vulnerability of moderate severity or worse. A green result is
      # narrower than it sounds: what Maven resolves at build time (most of
      # the tree comes through the Quarkus BOM), the base images and the
      # Python packages of the Ansible image are not covered by this check.
      - name: Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
