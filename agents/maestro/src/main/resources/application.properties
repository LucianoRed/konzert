quarkus.http.port=8080

agent.name=maestro
kafka.bootstrap=konzert-kafka-kafka-bootstrap.kafka.svc:9092
# Fixed group id: Maestro must not re-read the whole conversation after a
# restart and start answering messages it already answered.
kafka.group-id=konzert-maestro

konzert.conversation-topic=konzert.conversation
konzert.events-topic=konzert.events
konzert.idle-close-minutes=10
# The agents Maestro may delegate to, by name. Adding a member is configuration, not a new image.
konzert.team=${KONZERT_TEAM:atlas,sentinel}
