<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Maestro, the dispatcher agent">
  <title>Maestro</title>
  <!-- The dispatcher: one point, three lines leaving it. The whole job in one shape. -->
  <defs>
    <linearGradient id="maestroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#maestroBg)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.5"/>

  <!-- three routed paths, fanning out to three destinations -->
  <g fill="none" stroke="#ede9fe" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
    <path d="M60 62 C 60 40, 34 40, 30 30"/>
    <path d="M60 62 C 60 34, 60 34, 60 22"/>
    <path d="M60 62 C 60 40, 86 40, 90 30"/>
  </g>
  <g fill="#ede9fe">
    <circle cx="30" cy="28" r="7"/>
    <circle cx="60" cy="20" r="7"/>
    <circle cx="90" cy="28" r="7"/>
  </g>

  <!-- the baton: it conducts, it does not play -->
  <g stroke="#fde68a" stroke-width="4.5" stroke-linecap="round">
    <line x1="46" y1="92" x2="80" y2="66"/>
  </g>
  <circle cx="44" cy="94" r="6" fill="#fde68a"/>
  <circle cx="60" cy="62" r="10" fill="#ede9fe"/>
  <circle cx="60" cy="62" r="4.5" fill="#4c1d95"/>
</svg>
