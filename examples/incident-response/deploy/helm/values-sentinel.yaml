name: sentinel

image:
  repository: image-registry.openshift-image-registry.svc:5000/konzert-demo/konzert-worker

kafka:
  groupId: konzert-sentinel

mcp:
  ansibleUrl: http://konzert-mcp-ansible:8080/mcp/sse

agentConfig:
  identity:
    name: sentinel
    displayName: Sentinel
    emoji: "🛡️"
    color: "#059669"
    role: security
    avatar: /avatars/sentinel.svg
    # soul: seeded from examples/incident-response/souls/sentinel.md by hack/install.sh
  model:
    provider: openrouter
    baseUrl: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash
    triageModel: deepseek/deepseek-v4-flash
    reasoningEffort: low
    temperature: 0.2
    maxTokens: 3000
    timeoutSeconds: 60
    fallbackText: "I could not think that through in time — holding position."
  # propose = a mutating playbook waits for the operator's approval on the panel.
  # Switch to act on the Control Panel (or here) for the fully autonomous run.
  autonomy: propose
  memory:
    windowMessages: 16

intake:
  enabled: true
  selfName: sentinel
  subscriptions:
    - topic: konzert.conversation
      types:
        - io.konzert.MessagePosted
  rules:
    - name: addressed to me
      when:
        any:
          - field: data.to
            op: contains
            value: sentinel
          - field: data.to
            op: contains
            value: all
      then: reason
    - name: everything else
      then: count
  dedup:
    enabled: true
    fingerprint: [type, data.from, data.text]
    window: 5m
    onDuplicate: count
  debounce:
    enabled: false
  budget:
    eventsPerMinute: 8
    llmCallsPerHour: 80
    tokensPerHour: 200000
    onExceed: downgrade
  turnBudget: 12
  maxConcurrentIncidents: 1
