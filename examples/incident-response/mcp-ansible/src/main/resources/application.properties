quarkus.http.port=8080
# MCP SSE transport is served under /mcp (endpoints /mcp/sse and /mcp/messages),
# which is where the worker agents. MCP client looks for it.
quarkus.mcp.server.sse.root-path=/mcp

# Where the playbooks live inside the image. The catalogue is closed: an agent
# can only ask for a playbook that ships here.
ansible.playbook-dir=/opt/ansible/playbooks

# Namespaces a playbook is allowed to touch. Defence in depth: the ServiceAccount
# RBAC already scopes this, and the server refuses out-of-scope requests before
# ansible is even started.
ansible.allowed-namespaces=konzert-demo

# Hard ceiling on a single playbook run.
ansible.timeout-seconds=240

# How much playbook output goes back to the model. The full text is kept for the
# panel and retrievable with playbook_status; the model gets the tail, because
# 200 lines of ansible output is a lot of tokens for very little signal.
ansible.output-tail-chars=2500
