<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sentinel, the security agent">
  <title>Sentinel</title>
  <!-- Security here means containment, not destruction: a shield that closes a
       perimeter around something still alive inside it. -->
  <defs>
    <linearGradient id="sentinelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#sentinelBg)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.5"/>

  <!-- the shield -->
  <path d="M60 20 L92 32 v26 c0 22 -14 34 -32 42 c-18 -8 -32 -20 -32 -42 V32 z"
        fill="#d1fae5" opacity="0.95"/>

  <!-- the quarantined workload: contained, not deleted -->
  <circle cx="60" cy="60" r="13" fill="#064e3b"/>
  <circle cx="60" cy="60" r="5" fill="#fca5a5"/>

  <!-- the perimeter: closed on every side except one narrow path (DNS) -->
  <g fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round">
    <path d="M60 38 a22 22 0 0 1 22 22"/>
    <path d="M82 60 a22 22 0 0 1 -22 22"/>
    <path d="M60 82 a22 22 0 0 1 -22 -22"/>
    <path d="M38 60 a22 22 0 0 1 12 -19.5" stroke-dasharray="3 5"/>
  </g>
</svg>
