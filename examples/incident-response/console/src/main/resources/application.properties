quarkus.http.port=8080

kafka.bootstrap=konzert-kafka-kafka-bootstrap.kafka.svc:9092

konzert.topics=konzert.events,konzert.conversation,konzert.actions
konzert.namespace=konzert-demo

# The console is an observer, not an agent — no intake filter, no model, no key.
agent.name=konzert-console

# The roster the panel shows: name=base URL. Sensor and MCP server have no intake stats; only their health is shown.
konzert.agents=maestro=http://maestro:8080,atlas=http://atlas:8080,sentinel=http://sentinel:8080,sensor=http://konzert-sensor:8080,mcp-ansible=http://konzert-mcp-ansible:8080
