quarkus.http.port=8080

agent.name=konzert-sensor
kafka.bootstrap=konzert-kafka-kafka-bootstrap.kafka.svc:9092

konzert.namespace=${KONZERT_NAMESPACE:konzert-demo}
konzert.events-topic=konzert.events

# How often the sensor looks at the cluster.
sensor.interval-seconds=10
# A pod above this, in a Deployment that declares no memory limit, is an incident.
sensor.memory-threshold-mb=${SENSOR_MEMORY_THRESHOLD_MB:600}
# Log lines in the last window that look like a port sweep.
sensor.scan-pattern=port scan connect
sensor.scan-lines-threshold=${SENSOR_SCAN_LINES_THRESHOLD:15}
sensor.scan-window-seconds=30
# A fix must hold this long before the sensor confirms it.
sensor.confirm-hold-seconds=${SENSOR_CONFIRM_HOLD_SECONDS:30}
